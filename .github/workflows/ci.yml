name: source-release-acceptance
on:
  workflow_dispatch:
  push:
    paths: ["cpp/**", "rust/**", "python/**", "tests/**", "tools/**", "pixi.toml", ".github/workflows/ci.yml"]
  pull_request:
jobs:
  separated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        engine: [cpp, rust]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          run-install: false
      - run: pixi install -e ${{ matrix.engine }}
      - run: pixi run -e ${{ matrix.engine }} static-check
      - run: pixi run -e ${{ matrix.engine }} test-${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolution-${{ matrix.os }}-${{ matrix.engine }}
          path: |
            pixi.lock
            rust/Cargo.lock
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          run-install: false
      - run: pixi install
      - run: pixi run parity
      - run: pixi run wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*.whl
# This workflow definition was supplied, not triggered or verified externally.
